[package]
name = "jpx-mcp"
version = "0.1.4"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "JMESPath MCP server for AI assistants"
keywords = ["jmespath", "json", "mcp", "server", "ai"]
categories = ["network-programming", "development-tools"]

[lib]
name = "jpx_mcp"
path = "src/lib.rs"

[[bin]]
name = "jpx-mcp"
path = "src/main.rs"

[features]
default = ["let-expr"]
let-expr = ["jpx-engine/let-expr"]

[dependencies]
# Engine
jpx-engine = { workspace = true, features = ["schema"] }

# Core
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }

# MCP
tower-mcp = { workspace = true, features = ["http"] }
schemars = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# HTTP middleware
tower = { version = "0.5", features = ["timeout"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower-mcp = { workspace = true, features = ["http", "testing"] }
