[package]
name = "jpx-mcp"
version = "0.1.3"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "JMESPath MCP server for AI assistants"
keywords = ["jmespath", "json", "mcp", "server", "ai"]
categories = ["network-programming", "development-tools"]

[[bin]]
name = "jpx-mcp"
path = "src/main.rs"

[dependencies]
# Engine
jpx-engine = { workspace = true, features = ["schema"] }

# Core
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }

# MCP (default)
tower-mcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
default = ["mcp"]
mcp = ["tower-mcp", "schemars", "tokio", "tracing", "tracing-subscriber"]
# Future transports
# rest = ["axum", "tower"]
# grpc = ["tonic", "prost"]
