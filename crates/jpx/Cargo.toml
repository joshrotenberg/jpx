[package]
name = "jpx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "JMESPath CLI with 490+ functions, streaming, and reusable query libraries"
documentation = "https://github.com/joshrotenberg/jpx"
readme = "README.md"
keywords = ["jmespath", "json", "cli", "query", "jq"]
categories = ["command-line-utilities", "parsing", "text-processing"]

[[bin]]
name = "jpx"
path = "src/main.rs"

[lib]
name = "jpx"
path = "src/lib.rs"

[build-dependencies]
toml = "1.1"
serde = { workspace = true, features = ["derive"] }

[dependencies]
jpx-engine = { workspace = true }
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
colored_json.workspace = true
colored = "3"
rustyline = "17"
dirs = "6.0.0"
json-patch.workspace = true

# Output format support
serde_yaml = "0.9"
toml = "1.1"
csv = "1.3"
tabled = { version = "0.21", default-features = false, features = ["std"] }

# Parquet support (optional)
parquet = { version = "59", optional = true, default-features = false, features = ["arrow", "snap"] }

# Restore default SIGPIPE handling so `jpx ... | head` exits cleanly (Unix only).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
let-expr = ["jpx-engine/let-expr"]
parquet = ["dep:parquet", "jpx-engine/arrow"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
