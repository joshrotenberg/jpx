[package]
name = "jpx-core"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Complete JMESPath implementation with 470+ extension functions"
documentation = "https://docs.rs/jpx-core"
readme = "README.md"
keywords = ["jmespath", "json", "query", "parser"]
categories = ["data-structures", "parsing"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = "2"

# Extension dependencies (optional, pulled in by extensions feature)
heck = { version = "0.5", optional = true }
md-5 = { version = "0.10", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
crc32fast = { version = "1.5", optional = true }
base64 = { version = "0.23", optional = true }
urlencoding = { version = "2.1", optional = true }
regex = { version = "1.5", optional = true }
url = { version = "2.5", optional = true }
form_urlencoded = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
hex = { version = "0.4", optional = true }
rand = { version = "0.8", optional = true }
chrono = { version = "0.4", optional = true }
chrono-tz = { version = "0.10", optional = true }
interim = { version = "0.2", features = ["chrono_0_4"], optional = true }
dateparser = { version = "0.2", optional = true }
strsim = { version = "0.11", optional = true }
rphonetic = { version = "3.0", optional = true }
geoutils = { version = "0.5", optional = true }
geohash = { version = "0.13", optional = true }
semver_crate = { package = "semver", version = "1.0", optional = true }
ipnetwork = { version = "0.21", optional = true }
nanoid = { version = "0.4", optional = true }
ulid = { version = "1.1", optional = true }
json-patch = { version = "4.0", optional = true }
aho-corasick = { version = "1.1", optional = true }
csv = { version = "1.3", optional = true }
whatlang = { version = "0.18", optional = true }
rust-stemmers = { version = "1.2", optional = true }
stop-words = { version = "0.9", optional = true }
unicode-normalization = { version = "0.1", optional = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
criterion = { workspace = true }
jmespath = "0.3"
proptest = "1.6"

[[bench]]
name = "vs_jmespath"
harness = false

[features]
default = ["extensions", "let-expr"]
extensions = [
    "dep:heck",
    "dep:md-5", "dep:sha1", "dep:sha2", "dep:hmac", "dep:crc32fast",
    "dep:base64", "dep:hex",
    "dep:urlencoding", "dep:url", "dep:form_urlencoded",
    "dep:regex",
    "dep:uuid",
    "dep:rand",
    "dep:chrono", "dep:chrono-tz", "dep:interim", "dep:dateparser",
    "dep:strsim",
    "dep:rphonetic",
    "dep:geoutils", "dep:geohash",
    "dep:semver_crate",
    "dep:ipnetwork",
    "dep:nanoid", "dep:ulid",
    "dep:json-patch",
    "dep:aho-corasick",
    "dep:csv",
    "dep:whatlang",
    "dep:rust-stemmers", "dep:stop-words", "dep:unicode-normalization",
]
let-expr = []
