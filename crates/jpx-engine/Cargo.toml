[package]
name = "jpx-engine"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "JMESPath query engine with introspection, discovery, and advanced features"
documentation = "https://docs.rs/jpx-engine"
keywords = ["jmespath", "json", "query", "engine"]
categories = ["data-structures", "parsing"]

[dependencies]
# Core
jpx-core = { workspace = true, features = ["extensions"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Search and similarity
strsim = { workspace = true }

# JSON utilities
json-patch = { workspace = true }

# Configuration
toml = "0.9"
dirs = "6.0.0"

# Error handling
thiserror = "2"

# Schema generation (optional, for MCP server)
schemars = { workspace = true, optional = true }

# Arrow support (optional)
arrow = { version = "54", optional = true, default-features = false, features = ["json"] }

[features]
default = []
let-expr = ["jpx-core/let-expr"]
arrow = ["dep:arrow"]
schema = ["schemars"]

[dev-dependencies]
tokio = { workspace = true }
