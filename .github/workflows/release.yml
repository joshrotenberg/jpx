# This file was autogenerated by cargo-dist and then modified.
# It builds binaries for jpx when a version tag is pushed.
#
# Workflow:
# 1. release-plz creates a PR with version bumps and changelogs
# 2. When PR is merged, release-plz creates git tags
# 3. This workflow triggers on those tags and builds binaries
# 4. Binaries are uploaded to the GitHub Release

name: Release

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      # Only build binaries for jpx releases
      - "jpx-v[0-9]+.[0-9]+.[0-9]+*"
  # Allow manual trigger (useful when release-plz creates tags via API)
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., jpx-v0.1.2)"
        required: true
        type: string

env:
  # Use input tag for manual dispatch, otherwise use the pushed tag
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Run 'dist plan' to determine what tasks we need to do
  plan:
    runs-on: ubuntu-22.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.get-tag.outputs.tag }}
      tag-flag: ${{ steps.get-tag.outputs.tag-flag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Determine tag
        id: get-tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag-flag=--tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.2/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        run: |
          dist host --steps=create ${{ steps.get-tag.outputs.tag-flag }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      - name: Fetch local artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch local artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Upload to GitHub Release
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    if: ${{ always() && needs.plan.result == 'success' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-22.04
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt
          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  # Update Homebrew formula for jpx releases
  update-homebrew:
    needs:
      - host
    # Only run for jpx releases
    if: ${{ startsWith(inputs.tag || github.ref_name, 'jpx-v') }}
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: joshrotenberg/homebrew-brew
          token: ${{ secrets.COMMITTER_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract version from tag (jpx-v0.1.5 -> 0.1.5)
          VERSION="${TAG_NAME#jpx-v}"
          echo "Updating formula to version $VERSION"

          # Download SHA256 sums from release
          gh release download "$TAG_NAME" \
            --repo joshrotenberg/jpx \
            --pattern "*.sha256" \
            --dir /tmp/shas

          # Extract SHA256 for each platform
          SHA_AARCH64_DARWIN=$(cat /tmp/shas/jpx-aarch64-apple-darwin.tar.xz.sha256 | awk '{print $1}')
          SHA_X86_64_DARWIN=$(cat /tmp/shas/jpx-x86_64-apple-darwin.tar.xz.sha256 | awk '{print $1}')
          SHA_X86_64_LINUX=$(cat /tmp/shas/jpx-x86_64-unknown-linux-gnu.tar.xz.sha256 | awk '{print $1}')

          echo "SHA256 aarch64-darwin: $SHA_AARCH64_DARWIN"
          echo "SHA256 x86_64-darwin: $SHA_X86_64_DARWIN"
          echo "SHA256 x86_64-linux: $SHA_X86_64_LINUX"

          # Generate updated formula
          cat > homebrew-tap/Formula/jpx.rb << EOF
          class Jpx < Formula
            desc "JMESPath CLI with 400+ extended functions - a powerful jq alternative"
            homepage "https://github.com/joshrotenberg/jpx"
            version "$VERSION"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              on_arm do
                url "https://github.com/joshrotenberg/jpx/releases/download/$TAG_NAME/jpx-aarch64-apple-darwin.tar.xz"
                sha256 "$SHA_AARCH64_DARWIN"
              end
              on_intel do
                url "https://github.com/joshrotenberg/jpx/releases/download/$TAG_NAME/jpx-x86_64-apple-darwin.tar.xz"
                sha256 "$SHA_X86_64_DARWIN"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/joshrotenberg/jpx/releases/download/$TAG_NAME/jpx-x86_64-unknown-linux-gnu.tar.xz"
                sha256 "$SHA_X86_64_LINUX"
              end
            end

            def install
              bin.install "jpx"
            end

            test do
              assert_match "jpx", shell_output("#{bin}/jpx --version")
            end
          end
          EOF

      - name: Commit and push
        run: |
          cd homebrew-tap
          VERSION="${TAG_NAME#jpx-v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/jpx.rb
          git commit -m "jpx $VERSION"
          git push

  # Build Docker image for linux/amd64 using pre-built binary
  docker-amd64:
    name: Docker linux/amd64
    needs: [plan, host]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/jpx
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: meta
        run: |
          TAG="${{ needs.plan.outputs.tag }}"
          VERSION="${TAG#jpx-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.plan.outputs.tag }}"
          gh release download "$TAG" --pattern "jpx-x86_64-unknown-linux-gnu.tar.xz" --dir /tmp
          tar -xJf /tmp/jpx-x86_64-unknown-linux-gnu.tar.xz
          mv jpx-x86_64-unknown-linux-gnu/jpx ./jpx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/cli/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}-amd64
          labels: |
            org.opencontainers.image.title=jpx
            org.opencontainers.image.description=JMESPath CLI with extended functions
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # Build Docker image for linux/arm64 from source
  docker-arm64:
    name: Docker linux/arm64
    needs: [plan, host]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/jpx
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - name: Determine version
        id: meta
        run: |
          TAG="${{ needs.plan.outputs.tag }}"
          VERSION="${TAG#jpx-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/cli/Dockerfile.build
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}-arm64
          labels: |
            org.opencontainers.image.title=jpx
            org.opencontainers.image.description=JMESPath CLI with extended functions
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create multi-arch manifest for Docker CLI
  docker-manifest:
    name: Docker Multi-arch Manifest
    needs: [plan, docker-amd64, docker-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/jpx
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        run: |
          TAG="${{ needs.plan.outputs.tag }}"
          VERSION="${TAG#jpx-v}"
          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # Create manifest for version tag
          docker buildx imagetools create -t ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

          # Create manifest for major.minor tag
          docker buildx imagetools create -t ${IMAGE}:${MAJOR_MINOR} \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

          # Create manifest for major tag (only if major > 0)
          if [ "$MAJOR" != "0" ]; then
            docker buildx imagetools create -t ${IMAGE}:${MAJOR} \
              ${IMAGE}:${VERSION}-amd64 \
              ${IMAGE}:${VERSION}-arm64
          fi

          # Create manifest for latest tag
          docker buildx imagetools create -t ${IMAGE}:latest \
            ${IMAGE}:${VERSION}-amd64 \
            ${IMAGE}:${VERSION}-arm64

      - name: Verify multi-arch image
        run: |
          TAG="${{ needs.plan.outputs.tag }}"
          VERSION="${TAG#jpx-v}"
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}
