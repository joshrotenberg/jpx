name: Benchmarks

on:
  schedule:
    # Weekly on Monday at 06:00 UTC -- builds baseline history on main
    - cron: "0 6 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "crates/jpx-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bench-v1

      - name: Run benchmarks
        run: cargo bench -p jpx-core --bench vs_jmespath -- --output-format bencher | tee bench-output.txt

      - name: Store benchmark result (main)
        if: github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: jpx-core benchmarks
          tool: cargo
          output-file-path: bench-output.txt
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks/jpx-core
          auto-push: true
          alert-threshold: "150%"
          fail-threshold: "200%"
          comment-on-alert: true
          alert-comment-cc-users: "@joshrotenberg"

      - name: Compare benchmark result (PR)
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: jpx-core benchmarks
          tool: cargo
          output-file-path: bench-output.txt
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks/jpx-core
          save-data-file: false
          alert-threshold: "150%"
          fail-threshold: "200%"
          comment-on-alert: true
          alert-comment-cc-users: "@joshrotenberg"
