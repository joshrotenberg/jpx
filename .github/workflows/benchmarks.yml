name: Benchmarks

on:
  schedule:
    # Weekly on Monday at 06:00 UTC -- builds baseline history on main
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bench-v1

      - name: Run benchmarks
        run: cargo bench -p jpx-core --bench vs_jmespath -- --output-format bencher | tee bench-output.txt

      - name: Restore benchmark history
        uses: actions/cache/restore@v6
        with:
          path: .benchmark-cache
          key: benchmark-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            benchmark-${{ runner.os }}-

      - name: Analyze benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: jpx-core benchmarks
          tool: cargo
          output-file-path: bench-output.txt
          external-data-json-path: .benchmark-cache/data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: "150%"
          fail-threshold: "200%"
          fail-on-alert: true
          comment-on-alert: true
          alert-comment-cc-users: "@joshrotenberg"
          summary-always: true
          max-items-in-chart: 100

      - name: Save benchmark history
        uses: actions/cache/save@v6
        with:
          path: .benchmark-cache
          key: benchmark-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
