[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "jpx"
version = "0.1.0"
description = "JMESPath query engine with 490+ functions - Python bindings for jpx-core and jpx-engine"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Josh Rotenberg", email = "joshrotenberg@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]
keywords = ["jmespath", "json", "query", "transform", "filter"]

[project.urls]
Homepage = "https://github.com/joshrotenberg/jpx"
Repository = "https://github.com/joshrotenberg/jpx"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "jpx._core"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
